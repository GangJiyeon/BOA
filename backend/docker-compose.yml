# 로컬 개발용: FastAPI (DB는 각자 PC에 설치한 PostgreSQL 사용)
# 실행: docker compose up --build
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 컨테이너 안에서 localhost는 컨테이너 자신이라, 호스트 PC의 Postgres는 host.docker.internal로 접근한다
      DATABASE_URL: postgresql+psycopg://boa:boa@host.docker.internal:5432/boa
      # Windows에서 마운트한 폴더는 파일 변경 이벤트가 전달되지 않아 polling으로 감지한다
      WATCHFILES_FORCE_POLLING: "true"
    # Linux Docker에서도 host.docker.internal이 동작하도록 설정
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
